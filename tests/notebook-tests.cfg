[regex1]
regex: size \d+x\d+ with
replace: FIGURESIZE

[regex2]
regex: id="\d*"
replace: ID-STAMP

[regex3]
regex: \/\S+\/METEOR\/src\S+\:
replace: PATH-STAMP

[regex4]
regex: <matplotlib\.lines\.Line2D at 0x[0-9a-f]+>
replace: <matplotlib.lines.Line2D at MEMORY-ADDRESS>

[regex5]
regex: ✅ Noise generator fitted successfully\.
replace: Noise generator fitted successfully.

[regex6]
regex: ipykernel_\d+\/\d+\.py
replace: ipykernel_XXXXX/XXXXX.py

[regex7]
regex: https://matplotlib\.org/stable/users/explain/axes/legend_guide\.html
replace: https://matplotlib.org/stable/tutorials/intermediate/legend_guide.html

[regex8]
regex: <matplotlib\.legend\.Legend at 0x[0-9a-f]+>
replace: <matplotlib.legend.Legend at MEMORY-ADDRESS>
