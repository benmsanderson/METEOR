[regex15]
regex: CanESM5\n
replace: MODEL-NAME

[regex16]
regex: https://matplotlib\.org/stable/tutorials/intermediate/legend_guide\.html#controlling-the-legend-entries
replace: https://matplotlib.org/stable/users/explain/axes/legend_guide.html#controlling-the-legend-entries

[regex17]
regex: /tmp/ipykernel_\d+/\d+\.py:\d+: UserWarning:
